services:
  api:
    build: .
    ports: ["127.0.0.1:8000:8000"]
    environment:
      DATA_DIR: /app/runtime
      HF_HOME: /app/runtime/models
      MOCK_LLM: ${MOCK_LLM:-false}
      EMBEDDING_BACKEND: ${EMBEDDING_BACKEND:-sentence_transformers}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b-instruct}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes: ["./runtime:/app/runtime"]
  ui:
    build: .
    command: streamlit run ui.py --server.address 0.0.0.0 --server.port 8501 --browser.gatherUsageStats false
    ports: ["127.0.0.1:8501:8501"]
    environment:
      API_URL: http://api:8000
    depends_on: [api]
